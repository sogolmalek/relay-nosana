[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-nosana"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "anthropic>=0.28",
    "openai>=1.30",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "numpy>=1.26",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
relay = "relay_nosana.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["relay_nosana*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
